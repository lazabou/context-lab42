system {
    host-name R3;
    root-authentication {
        plain-text-password-value "Poclab123!";
    }
}
interfaces {
    lo0 {
        unit 0 {
            family inet {
                address 3.3.3.3/32;
            }
            family mpls;
        }
    }
    eth1 {
        description "to R1";
        unit 0 {
            family inet {
                address 10.0.13.2/30;
            }
            family mpls;
        }
    }
    eth2 {
        description "to R2";
        unit 0 {
            family inet {
                address 10.0.23.2/30;
            }
            family mpls;
        }
    }
    eth3 {
        description "to R12 (VRF VPN1)";
        unit 0 {
            family inet {
                address 10.0.312.1/30;
            }
        }
    }
}
routing-instances {
    VPN1 {
        instance-type vrf;
        interface eth3.0;
        route-distinguisher 65000:3;
        vrf-target target:65000:1;
        protocols {
            bgp {
                group CE-R12 {
                    type external;
                    peer-as 65012;
                    neighbor 10.0.312.2;
                }
            }
        }
    }
}
protocols {
    mpls {
        interface eth1.0;
        interface eth2.0;
        interface lo0.0;
    }
    ospf {
        traffic-engineering;
        area 0.0.0.0 {
            interface lo0.0 {
                passive;
            }
            interface eth1.0;
            interface eth2.0;
        }
    }
    ldp {
        interface eth1.0;
        interface eth2.0;
        interface lo0.0;
    }
    bgp {
        group IBGP-PE {
            type internal;
            local-address 3.3.3.3;
            family inet-vpn {
                unicast;
            }
            neighbor 1.1.1.1;
            neighbor 2.2.2.2;
        }
    }
}
routing-options {
    router-id 3.3.3.3;
    autonomous-system 65000;
}
